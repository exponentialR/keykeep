<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save to Keykeep</title><link rel="stylesheet" href="popup.css"></head><body>
<header><strong>◈ Keykeep</strong><span>Save this login</span></header>
<main><p class="note">Read the login on this page, then review it in your vault. Nothing is saved automatically.</p>
<button id="read" class="primary">Read this login</button>
<form id="review" hidden><label for="field">Password field</label><select id="field"></select><label for="name">Name</label><input id="name" required maxlength="150"><label for="username">Username or email</label><input id="username" maxlength="250" autocomplete="off"><label for="website">Website</label><input id="website" readonly><label for="password">Password</label><input id="password" type="password" required maxlength="4096" autocomplete="off"><button id="show" type="button">Show password</button><button class="primary">Continue in Keykeep</button><button id="cancel" type="button">Clear login</button></form>
<p id="status" role="status" aria-live="polite"></p>
<details id="settings"><summary>Connect your Keykeep app</summary><form id="connect"><label for="app">Keykeep app address</label><input id="app" type="url" required placeholder="https://passwords.example.com/app"><p class="note">Connect only a Keykeep host you trust. Sign in there before saving a login. Your master password is entered in Keykeep.</p><button>Connect app</button></form><a id="open" hidden target="_blank" rel="noopener noreferrer">Open Keykeep to sign in</a></details></main><script type="module" src="popup.js"></script></body></html>
